# Render Blueprint: one free web service that serves both the API and the built React app.
# Database: Supabase Postgres (NOT Render's free Postgres, which is deleted after 30 days + 14 days grace).
services:
  - type: web
    name: navigator-projectos
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: >-
      cd frontend && npm ci && npm run build &&
      cd ../backend && pip install -r requirements.txt
    # Migrations run on start (pre-deploy commands are not available on the free plan).
    startCommand: >-
      cd backend && alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: NODE_VERSION
        value: 22.22.0
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_BUCKET
        value: documents
      # Secrets: set these in the Render dashboard (sync: false keeps them out of this file).
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: INTERNAL_SYNC_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ALLOWED_GITHUB_USER_IDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
