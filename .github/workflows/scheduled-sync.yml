name: Scheduled GitHub sync

# Render's free plan has no cron jobs or background workers, so this workflow
# asks the app to sync. Set repository secrets:
#   APP_URL               e.g. https://navigator-projectos.onrender.com
#   INTERNAL_SYNC_SECRET  same value as the Render environment variable
on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the service (a sleeping free instance takes about a minute)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL secret is not set; skipping."; exit 0; fi
          for i in $(seq 1 12); do
            if curl -fsS --max-time 20 "$APP_URL/api/v1/health/ready" > /dev/null; then echo "awake"; exit 0; fi
            sleep 10
          done
          echo "Service did not wake up"; exit 1
      - name: Run sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_SYNC_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then exit 0; fi
          curl -fsS --max-time 90 -X POST -H "Authorization: Bearer $SECRET" "$APP_URL/api/v1/internal/sync" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('jobs run:', d.get('ran'), d.get('reason', ''))"
